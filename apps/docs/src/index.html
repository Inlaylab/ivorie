<!doctype html>
<html lang="en" style="color-scheme: light">
<head>
  <meta charset="utf-8">
  <title>Ivorie</title>
  <meta name="description" content="Angular components with the shadcn/ui look and behavior.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="alternate" type="application/rss+xml" title="Ivorie changelog" href="changelog.xml">
  <link rel="icon" type="image/svg+xml" href="app.svg">
</head>
<body class="theme-slate">
  <!-- Apply the saved appearance before first paint. Must never throw. -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('ivorie-docs:appearance') || 'null') || {};
        // No saved mode means system. The server markup is light; dark is added before first paint.
        var dark = s.mode === 'dark' || (s.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
