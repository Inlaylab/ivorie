<iv-sidebar-provider class="docs-shell flex-col">
  <docs-site-header />
  <div class="flex flex-1">
    <iv-sidebar>
      <iv-sidebar-content class="no-scrollbar py-4">
        <docs-site-nav />
      </iv-sidebar-content>
    </iv-sidebar>
    <div ivSidebarInset class="min-w-0">
      <main class="mx-auto w-full px-4 py-8 sm:px-6 lg:px-10 lg:py-10" [class.max-w-6xl]="!wide()" [class.max-w-screen-2xl]="wide()">
        <router-outlet />
      </main>
    </div>
  </div>
</iv-sidebar-provider>
