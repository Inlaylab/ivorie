version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'ng-packagr']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'tw-animate-css']
      tooling:
        patterns: ['*']
    # Angular majors go through ng update (docs/COMPAT.md).
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
