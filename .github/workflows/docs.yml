name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Project site lives under /<repo>/. Not `npm run docs:build`: it cannot forward --base-href to ng.
      - run: node tools/docs/build.ts
      - run: npx ng build docs --base-href /${{ github.event.repository.name }}/
      - run: node tools/docs/postbuild.ts --verify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
